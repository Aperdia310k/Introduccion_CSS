<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprende CSS3 Paso a Paso - Entorno Didáctico Interactivo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <header class="app-header">
    <div class="header-content">
      <h1><i class="fa-brands fa-css3-alt"></i> Curso Interactivo de CSS3</h1>
      <p class="subtitle">Aprende la teoría, prueba en tiempo real y resuelve los retos prácticos</p>
    </div>
  </header>

  <main class="app-container">
    <!-- Menú lateral y panel educativo -->
    <aside class="sidebar">
      <h2>Módulos del Curso</h2>
      <nav class="lesson-menu">
        <button class="lesson-btn active" data-step="1">
          <i class="fa-solid fa-layer-group"></i> 1. HTML vs CSS & Arquitectura
        </button>
        <button class="lesson-btn" data-step="2">
          <i class="fa-solid fa-code"></i> 2. Formas de Inclusión de CSS
        </button>
        <button class="lesson-btn" data-step="3">
          <i class="fa-solid fa-box"></i> 3. Modelo de Cajas y Cascada
        </button>
        <button class="lesson-btn" data-step="4">
          <i class="fa-solid fa-bullseye"></i> 4. Selectores y Especificidad
        </button>
      </nav>

      <!-- Contenido Teórico Detallado -->
      <section class="theory-panel">
        <h3 id="lesson-title">Cargando módulo...</h3>
        <div id="lesson-content" class="theory-body">
          <!-- Se inyecta dinámicamente con JavaScript -->
        </div>
      </section>
    </aside>

    <!-- Playground de desarrollo -->
    <section class="workspace">
      <div class="editor-pane">
        <div class="code-box">
          <div class="code-header">
            <span><i class="fa-brands fa-html5"></i> Estructura (HTML)</span>
            <button class="reset-btn" id="reset-html" title="Restablecer HTML"><i class="fa-solid fa-rotate-left"></i></button>
          </div>
          <textarea id="html-code" spellcheck="false"></textarea>
        </div>
        <div class="code-box">
          <div class="code-header">
            <span><i class="fa-brands fa-css3-alt"></i> Estilos (CSS)</span>
            <button class="reset-btn" id="reset-css" title="Restablecer CSS"><i class="fa-solid fa-rotate-left"></i></button>
          </div>
          <textarea id="css-code" spellcheck="false"></textarea>
        </div>
      </div>

      <!-- Renderizado en directo -->
      <div class="preview-pane">
        <div class="preview-header">
          <span><i class="fa-solid fa-desktop"></i> Navegador (Resultado en Vivo)</span>
        </div>
        <iframe id="preview-frame"></iframe>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
